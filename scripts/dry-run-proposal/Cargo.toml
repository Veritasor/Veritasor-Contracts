[package]
name = "dry-run-proposal"
version = "0.1.0"
edition = "2021"
publish = false
description = "Dry-runs a protocol-dao proposal and reports its effect on the attestation contract's DAO-visible fee config"

# Standalone tool; deliberately not a member of the contracts workspace so
# its dependency graph never touches soroban-sdk (this shells out to the
# `stellar` CLI rather than embedding the SDK).
[workspace]

[[bin]]
name = "dry-run-proposal"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
