[package]
name = "veritasor-revenue-share"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.81.0"

[lib]
crate-type = ["cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
veritasor-common = { path = "../common" }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
veritasor-attestation = { path = "../attestation" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
