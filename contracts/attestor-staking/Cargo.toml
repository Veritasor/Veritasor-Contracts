[package]
name = "veritasor-attestor-staking"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.81.0"

[lib]
crate-type = ["rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0"

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
proptest = { version = "=1.5.0", default-features = false, features = ["std"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
