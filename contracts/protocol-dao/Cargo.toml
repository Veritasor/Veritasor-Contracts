[package]
name = "veritasor-protocol-dao"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.81.0"

[lib]
# "rlib" added so this crate can be imported as a normal Rust library by
# scripts/dry-run-proposal (a cross-contract simulation tool) — every other
# contract in this workspace already builds both crate-types.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "22.0"

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

