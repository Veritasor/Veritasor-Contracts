[package]
name = "veritasor-common"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.81.0"

[lib]
doctest = false

[dependencies]
soroban-sdk = { version = "22.0" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
veritasor-attestation = { path = "../attestation" }
veritasor-integration-registry = { path = "../integration-registry" }
veritasor-attestation-snapshot = { path = "../attestation-snapshot" }
veritasor-aggregated-attestations = { path = "../aggregated-attestations" }
veritasor-protocol-dao = { path = "../protocol-dao" }
proptest    = { version = "=1.5.0", default-features = false, features = ["std"] }
proptest-state-machine = "0.1"
