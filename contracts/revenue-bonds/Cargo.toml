[package]
name = "veritasor-revenue-bonds"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies.veritasor-attestation]
path = "../attestation"
optional = true

[features]
default = []
testutils = ["veritasor-attestation"]


