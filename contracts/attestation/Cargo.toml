[package]
name = "veritasor-attestation"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.81.0"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
default = []
# Enable the full legacy test suite (requires all feature modules to compile cleanly).
full-tests = []

[dependencies]
soroban-sdk = "22.0"
veritasor-common = { path = "../common" }
veritasor-attestor-staking = { path = "../attestor-staking" }

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }
proptest    = { version = "=1.5.0", default-features = false, features = ["std"] }
veritasor-common = { path = "../common" }
veritasor-attestor-staking = { path = "../attestor-staking" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
