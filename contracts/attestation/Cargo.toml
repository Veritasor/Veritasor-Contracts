[package]
name = "veritasor-attestation"
version = "0.1.0"
edition = "2021"
publish = false
rust-version = "1.81.0"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[build-dependencies]
syn = { version = "2.0", features = ["full", "extra-traits"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"

[features]
default = []
# Enable the full legacy test suite (requires all feature modules to compile cleanly).
full-tests = []
kani = []

[dependencies]
soroban-sdk = "22.0"
veritasor-common = { path = "../common" }
veritasor-attestor-staking = { path = "../attestor-staking" }

[dev-dependencies]
arbitrary = { version = "1.3", features = ["derive"] }
soroban-sdk = { version = "22.0", features = ["testutils"] }
serde_json = "1.0"
proptest    = { version = "=1.5.0", default-features = false, features = ["std"] }
veritasor-common = { path = "../common" }
veritasor-attestor-staking = { path = "../attestor-staking" }

[target.'cfg(kani)'.dependencies]
kani = { git = "https://github.com/model-checking/kani", tag = "kani-0.57.0" }

# ── Kani proof harnesses ────────────────────────────────────────────────────
# Each [[bin]] target below corresponds to a file under kani/.  The targets
# are only compiled when `cargo kani` (or `cargo kani --harness <name>`) is
# invoked; they are excluded from normal `cargo test --all` runs because the
# `kani` crate is not present in the default feature set.
#
# Naming convention: one file per logical group of related harnesses.

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
